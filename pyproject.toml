[project]
name = "bio-manim"
version = "0.1.0"
description = "A consistent visual language for teaching DNA methods with Manim"
requires-python = ">=3.10"
dependencies = ["manim>=0.19.2,<0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dna_animations*"]

[project.optional-dependencies]
dev = ["pytest>=8"]
